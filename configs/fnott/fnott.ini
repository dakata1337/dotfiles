# -*- conf -*-
# Minimalist Semi-Transparent Pastel Theme for fnott (Wayland + wofi)
# with Hyprland-inspired pastel border

# Global values
output=
min-width=0
max-width=420
max-height=200
stacking-order=bottom-up
anchor=top-right
edge-margin-vertical=10
edge-margin-horizontal=10
notification-margin=8
icon-theme=hicolor
max-icon-size=24

# Use wofi instead of dmenu for user input (Wayland compatible)
selection-helper=wofi -d -p "Select:"
selection-helper-uses-null-separator=no

play-sound=

# Default values
layer=top
background=222222dd        # dark, slightly transparent background
border-color=827ea0ee      # gradient-inspired pastel lavender border
border-radius=8
border-size=2
padding-vertical=12
padding-horizontal=18
dpi-aware=yes

# Fonts and Colors
title-font=sans-serif:bold
title-color=e8e8e8ff
title-format=%a

summary-font=sans-serif
summary-color=fafafaff
summary-format=<b>%s</b>\n

body-font=sans-serif
body-color=ddddddff
body-format=%b

progress-bar-height=4
progress-color=9ad4baff     # pastel mint
progress-style=bar

# Timeout values
max-timeout=10
default-timeout=6
idle-timeout=0

[low]
background=222222cc
title-color=cacacaee
summary-color=ddddeeff
body-color=cacacaee
border-color=9ad4baff       # pastel mint border

[normal]
background=222222dd
title-color=e8e8e8ff
summary-color=f0f0f0ff
body-color=ddddddff
border-color=827ea0ee       # soft violet-gray border (gradient match)

[critical]
background=222222dd
title-color=fff3f3ff
summary-color=ffececff
body-color=ffdadaff
border-color=ffb3b3ff       # pastel red-pink border

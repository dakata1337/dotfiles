
log_level = "warn"
position = "Top"
region = "bg-BG"

[modules]
left = [ [ "appLauncher","Workspaces" ] ]
center = [ "WindowTitle" ]
right = [ "MediaPlayer", [ "Tray", "Tempo", "Privacy", "Settings", "Notifications" ] ] # Available: "SystemInfo"

[workspaces]
visibility_mode = "All"           # "All" (default), "MonitorSpecific", "MonitorSpecificExclusive"
enable_workspace_filling = true
max_workspaces = 4
workspace_names = [" ", " ", "󰈹 ", " " , " ",  " ",  " ",  " ", " "]

[[CustomModule]]
name = "appLauncher"
icon = "󱗼"
command = "wofi --show drun"

[window_title]
mode = "Title"                   # "Title" (default), "Class", "InitialTitle", "InitialClass"
truncate_title_after_length = 80 # (default) 0 means no truncation; capped at 2048
background_color = "#222fff"

[keyboard_layout]
# labels = { "English (US)" = "EN", "Italian" = "IT" }  # (default: {}) map layout names to short labels

[system_info]
indicators = [ "Cpu", "Memory", "Temperature" ]
interval = 5

[media_player]
max_title_length = 40        # (default)
# indicator_format = "IconAndTitle"  # (default) or "Icon"

[tray]
blocklist = []    # (default: []) hide tray items matching regex patterns
right_click = "menu"     # (default: None) "open" or "menu"; sets right-click action, left click gets the complement

[tempo]
clock_format = "%a %d %b %R"
weather_location = { City = "Ruse" }
weather_indicator = "IconAndTemperature"  # (default), "Icon", or "None"

[notifications]
format = "%H:%M"
show_timestamps = true
show_bodies = true
grouped = true           # (default) group notifications by app
toast = true              # (default) enable toast popups
toast_position = "top_right"  # (default) "TopLeft", "TopRight", "BottomLeft", "BottomRight"
toast_limit = 3           # (default) max concurrent toasts
toast_max_height = 125    # (default) max height of toast cards in pixels

[settings]
# Optional: disable hover tooltips on status indicators
enable_tooltips = true
lock_cmd = "playerctl --all-players pause; hyprlock &"
audio_indicator_format = "IconAndPercentage"
audio_sinks_more_cmd = "pavucontrol -t 3"
audio_sources_more_cmd = "pavucontrol -t 4"
wifi_more_cmd = "nm-connection-editor"
vpn_more_cmd = "nm-connection-editor"
bluetooth_more_cmd = "blueberry"
volume_step = 5    # (default) step size for IPC volume up/down, range 1..=50
max_volume = 100   # (default) max volume level, range 1..=200 (>100 enables overdrive)
remove_airplane_btn = true   # (default) set true to hide airplane mode button
indicators = [ "IdleInhibitor", "PowerProfile", "Audio", "Microphone", "Bluetooth", "Network", "Vpn", "Battery", "Brightness" ]

[osd]
enabled = true   # (default)
timeout = 1500    # milliseconds
show_volume_percentage = true      # (default) show numeric volume value in the OSD
show_brightness_percentage = true  # (default) show numeric brightness value in the OSD

[animations]
enabled = true   # (default)

[appearance]
style = "Islands"  # (default), "Solid", or "Gradient"
font_name = "Hack Nerd Font"           # (default: None) custom font family
# scale_factor = 1.00           # (default) range: 0.0 < x <= 2.0
opacity = 0.5                # (default) range: 0.0 to 1.0
primary_color = "#7aa2f7"
success_color = "#9ece6a"
warning_color = "#e0af68"
danger_color = "#ff0000"
text_color = "#a9b1d6"
workspace_colors = [ "#24273a", "#9ece6a" ]

[appearance.menu]
opacity = 0.95   # (default) menu background opacity
# backdrop = 0.0   # (default) backdrop blur amount

[appearance.background_color]
base = "#1a1b26"
weak = "#24273a"
strong = "#414868"
# weakest = "#000000"    # (default: None)
# weaker = "#000000"     # (default: None)
# neutral = "#000000"    # (default: None)
# stronger = "#000000"   # (default: None)
# strongest = "#000000"  # (default: None)
# text = "#ffffff"       # (default: None)
